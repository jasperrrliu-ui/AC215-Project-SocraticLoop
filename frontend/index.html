<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SocraticLoop Conversational MVP</title>
  <style>
    :root { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; color: #dce5f5; background: #101827; }
    * { box-sizing: border-box; } body { margin: 0; } main { max-width: 1280px; margin: auto; padding: 28px 20px 50px; }
    header { display: flex; justify-content: space-between; align-items: start; gap: 16px; margin-bottom: 18px; } h1 { margin: 0 0 5px; font: 700 28px system-ui, sans-serif; } .muted { color: #91a0b7; font: 14px system-ui, sans-serif; }
    .badge { color: #9df2b7; border: 1px solid #2e8752; border-radius: 999px; padding: 7px 10px; font: 12px system-ui, sans-serif; }
    .layout { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(290px, .8fr); gap: 16px; } .panel { background: #172236; border: 1px solid #2b3a55; border-radius: 12px; overflow: hidden; }
    .panel-title { padding: 12px 15px; border-bottom: 1px solid #2b3a55; color: #aebddd; font: 700 12px system-ui, sans-serif; text-transform: uppercase; letter-spacing: .1em; }
    #transcript { min-height: 500px; max-height: 650px; overflow: auto; padding: 18px; } .line { margin: 0 0 16px; white-space: pre-wrap; line-height: 1.55; }
    .role { color: #7db2ff; font-weight: 700; } .checkpoint { color: #ffd479; } .system { color: #8da0ba; } .good { color: #9df2b7; } .warning { color: #ffbf7a; }
    .composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #2b3a55; } input { flex: 1; min-width: 0; background: #0f1725; color: #e9f0ff; border: 1px solid #405170; border-radius: 7px; padding: 11px; font: inherit; } button { border: 0; border-radius: 7px; padding: 10px 14px; background: #4f7cff; color: white; cursor: pointer; font-weight: 700; }
    aside { padding: 16px; font: 14px system-ui, sans-serif; } aside h3 { margin: 5px 0 8px; font-size: 13px; color: #aebddd; } .item { padding: 9px 0; border-bottom: 1px solid #2b3a55; line-height: 1.45; } .state { color: #9df2b7; } .warn { color: #ffbf7a; }
    @media (max-width: 820px) { header { display: block; } .badge { display: inline-block; margin-top: 12px; } .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <header><div><h1>SocraticLoop</h1><div class="muted">CLI-style conversational research assistant · API-backed deterministic demo</div></div><div class="badge">No LLM/API key required</div></header>
  <div class="layout">
    <section class="panel"><div class="panel-title">Conversation</div><div id="transcript"><div class="line system">$ socratic run "Why does validation loss become unstable?"</div><div class="line system">Type your answer when the assistant pauses at a research checkpoint.</div></div><form class="composer" id="form"><input id="input" autocomplete="off" placeholder="Start a research session..." disabled><button id="send" disabled>Send</button></form></section>
    <aside class="panel"><div class="panel-title">Research State</div><div id="state"><div class="item">No active session.</div></div></aside>
  </div>
</main>
<script>
let sessionId = null, currentCheckpoint = null;
const transcript = document.querySelector('#transcript'), input = document.querySelector('#input'), send = document.querySelector('#send'), state = document.querySelector('#state');
const add = (text, cls='') => { const el = document.createElement('div'); el.className = `line ${cls}`; el.textContent = text; transcript.appendChild(el); transcript.scrollTop = transcript.scrollHeight; };
const update = (d) => { const s=d.research_state||{}; currentCheckpoint=(s.checkpoints||[]).find(x=>x.status==='pending')||null; state.innerHTML=`<h3>Question</h3><div class="item">${s.question||''}</div><h3>Hypotheses</h3>${(s.hypotheses||[]).map(h=>`<div class="item"><b>${h.id}</b> ${h.text}<br><span class="state">${h.status}</span></div>`).join('')}<h3>Phase</h3><div class="item state">${d.phase}</div>${d.validation?`<h3>Validation</h3><div class="item warn">${d.validation.warnings.map(w=>w.message).join('<br>')}</div>`:''}${s.conclusion?`<h3>Conclusion</h3><div class="item">${s.conclusion}</div>`:''}`; input.disabled=!currentCheckpoint; send.disabled=!currentCheckpoint; input.placeholder=currentCheckpoint?currentCheckpoint.question:'Workflow complete'; };
async function start(){ const d=await fetch('/api/sessions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({})}).then(r=>r.json()); sessionId=d.session_id; const e=d.research_state.experiment; add(`[Planner] Proposed ${e.id}: learning-rate sweep {0.001, 0.01, 0.1} on SGD.` ,'role'); add(`[RAG] Retrieved literature context: ${d.literature.map(x=>x.title).join('; ')}`,'system'); add(`[Checkpoint: Purpose and prediction] ${d.research_state.checkpoints[0].question}`,'checkpoint'); update(d); }
document.querySelector('#form').onsubmit=async(ev)=>{ev.preventDefault(); if(!currentCheckpoint||!input.value.trim())return; const answer=input.value.trim(); add(`> ${answer}`,'good'); input.value=''; const d=await fetch(`/api/sessions/${sessionId}/checkpoints`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({checkpoint_id:currentCheckpoint.id,answer})}).then(r=>r.json()); if(d.phase==='interpretation'){ add('[Executor] Synthetic experiment complete.','role'); add(`[Validator] ${d.validation.warnings.map(w=>w.message).join(' ')}`,'warning'); add(`[Checkpoint: Interpretation] ${d.research_state.checkpoints[1].question}`,'checkpoint'); } else if(d.phase==='completed'){ add(`[Analyst] ${d.analysis.conclusion}`,'role'); add(`[State] Research state updated. Next action: rerun with the planned configuration.`,'good'); } update(d); };
start();
</script>
</body>
</html>
